spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users-service
              uri: http://localhost:5001
              predicates:
                - Path=/api/v1/user/**

            - id: saloon-service
              uri: http://localhost:5002
              predicates:
                - Path=/api/v1/salon/**

            - id: category-service
              uri: http://localhost:5003
              predicates:
                - Path=/api/v1/category/**

            - id: service-offring-service
              uri: http://localhost:5004
              predicates:
                - Path=/api/v1/service-offering/**, /api/v1/salon/service-offering/**

            - id: booking-service
              uri: http://localhost:5005
              predicates:
                - Path=/api/v1/bookings/**

            - id: payment-service
              uri: http://localhost:5006
              predicates:
                - Path=/api/payments/**





